<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beach Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>🏖️ Beach Finder</h1>
    <p>Tell us where you are. We'll find the best, most popular, coolest beach for a day out.</p>

    <form id="search" class="search">
      <input id="place" type="text" placeholder="City or address, e.g. Los Angeles" autocomplete="off" />
      <button type="submit">Find beaches</button>
      <button type="button" id="geo" class="secondary">📍 Use my location</button>
    </form>

    <div class="filters">
      <label>Within
        <select id="radius">
          <option value="50">50 km</option>
          <option value="150" selected>150 km</option>
          <option value="500">500 km</option>
          <option value="2000">2,000 km</option>
          <option value="Infinity">Anywhere</option>
        </select>
      </label>
      <label>Vibe
        <select id="vibe">
          <option value="">Any</option>
          <option value="chill">Chill</option>
          <option value="party">Party</option>
          <option value="surf">Surf</option>
          <option value="snorkel">Snorkel</option>
          <option value="scenic">Scenic</option>
          <option value="family">Family</option>
          <option value="people-watching">People-watching</option>
          <option value="wildlife">Wildlife</option>
        </select>
      </label>
      <label>Sort by
        <select id="sort">
          <option value="best">Best match</option>
          <option value="distance">Closest</option>
          <option value="popularity">Most popular</option>
          <option value="cool">Coolest</option>
        </select>
      </label>
    </div>
    <p id="status" class="status" role="status"></p>
  </header>

  <main class="layout">
    <section id="pick" class="pick" hidden></section>
    <div class="columns">
      <ol id="results" class="results"></ol>
      <div id="map" class="map"></div>
    </div>
  </main>

  <footer>Geocoding by <a href="https://nominatim.openstreetmap.org/" target="_blank" rel="noopener">OpenStreetMap Nominatim</a>. Map © OpenStreetMap contributors.</footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="beaches.js"></script>
  <script src="app.js"></script>
</body>
</html>
